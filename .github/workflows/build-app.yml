name: Gerar app

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "*.gradle.kts"
      - "gradle/**"
      - "gradle.properties"
      - ".github/workflows/build-app.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Incluir os dados mais recentes na app
        run: |
          mkdir -p app/src/main/assets
          cp data/zones.json app/src/main/assets/zones.json

      - name: Compilar
        run: |
          set -o pipefail
          ./gradlew assembleRelease --no-daemon --stacktrace 2>&1 | tee build.log
          cp app/build/outputs/apk/release/app-release.apk voa-voa.apk

      - name: Publicar
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Voa Voa 1.0.${{ github.run_number }}
          body: |
            Para instalar no Android: abre esta página no telemóvel e toca em **voa-voa.apk**.
          files: voa-voa.apk
          make_latest: true

      - name: Guardar registo do erro
        if: failure()
        run: |
          cp build.log /tmp/build.log 2>/dev/null || echo "sem registo" > /tmp/build.log
          git checkout --orphan ci-logs-tmp
          git rm -rf --cached . > /dev/null
          cp /tmp/build.log build-error.log
          git add -f build-error.log
          git -c user.name=voa-voa-bot -c user.email=bot@users.noreply.github.com commit -m "Erro no build"
          git push -f origin HEAD:refs/heads/ci-logs-build

name: Gerar app

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "wear/**"
      - "shared/**"
      - "*.gradle.kts"
      - "gradle/**"
      - "gradle.properties"
      - ".github/workflows/build-app.yml"
      - "VERSION"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Calcular a versão
        run: |
          BASE=$(cat VERSION | tr -d '[:space:]')
          LAST=$(git log -1 --format=%H -- VERSION)
          # Correções = alterações à app desde a última mudança de VERSION
          PATCH=$(git rev-list --count "$LAST"..HEAD -- app wear shared '*.gradle.kts' gradle gradle.properties .github/workflows/build-app.yml)
          echo "VERSION_PATCH=$PATCH" >> "$GITHUB_ENV"
          echo "VERSION_NAME=$BASE.$PATCH" >> "$GITHUB_ENV"
          echo "Versão: $BASE.$PATCH (build ${{ github.run_number }})"

      - name: Incluir os dados mais recentes na app
        run: |
          mkdir -p app/src/main/assets wear/src/main/assets
          cp data/zones.json app/src/main/assets/zones.json
          cp data/zones.json wear/src/main/assets/zones.json

      - name: Compilar
        run: |
          set -o pipefail
          ./gradlew :app:assembleRelease :wear:assembleRelease --no-daemon --stacktrace 2>&1 | tee build.log
          cp app/build/outputs/apk/release/app-release.apk voa-voa.apk
          cp wear/build/outputs/apk/release/wear-release.apk voa-voa-wear.apk

      - name: Publicar
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION_NAME }}.${{ github.run_number }}
          name: Voa Voa ${{ env.VERSION_NAME }}
          body: |
            **Telemóvel:** abre esta página no telemóvel e toca em **voa-voa.apk**.
            **Relógio (Wear OS):** instala o **voa-voa-wear.apk** no relógio (ver README).
          files: |
            voa-voa-wear.apk
            voa-voa.apk
          make_latest: true

      - name: Guardar registo do erro
        if: failure()
        run: |
          cp build.log /tmp/build.log 2>/dev/null || echo "sem registo" > /tmp/build.log
          git checkout --orphan ci-logs-tmp
          git rm -rf --cached . > /dev/null
          cp /tmp/build.log build-error.log
          git add -f build-error.log
          git -c user.name=voa-voa-bot -c user.email=bot@users.noreply.github.com commit -m "Erro no build"
          git push -f origin HEAD:refs/heads/ci-logs-build

name: Atualizar dados ANAC

on:
  schedule:
    - cron: "23 5,17 * * *"   # duas vezes por dia (05:23 e 17:23 UTC)
  workflow_dispatch:           # botão "Run workflow" para correr à mão
  push:
    branches: [main]
    paths:
      - scripts/update_data.py
      - .github/workflows/update-data.yml

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Descarregar e validar zonas
        run: |
          set -o pipefail
          python3 scripts/update_data.py 2>&1 | tee run.log

      - name: Guardar no repositório
        run: |
          git config user.name "voa-voa-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "Nada a guardar"
            exit 0
          fi
          git commit -m "Dados ANAC: $(date -u +'%Y-%m-%d %H:%M') UTC"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Guardar registo do erro
        if: failure()
        run: |
          cp run.log /tmp/run.log 2>/dev/null || echo "sem registo" > /tmp/run.log
          git checkout --orphan ci-logs-tmp
          git rm -rf --cached . > /dev/null
          cp /tmp/run.log data-error.log
          git add data-error.log
          git -c user.name=voa-voa-bot -c user.email=bot@users.noreply.github.com commit -m "Erro na atualização de dados"
          git push -f origin HEAD:refs/heads/ci-logs-data
